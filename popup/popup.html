<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Chat Downloader</title>
</head>
<body>
  <div class="stack">

    <div class="sheet sheet-pink" aria-hidden="true"></div>
    <div class="sheet sheet-yellow" aria-hidden="true"></div>

    <div class="ticket">
      <div class="perf" aria-hidden="true"></div>
      <span class="watermark" aria-hidden="true">DUPLICATE</span>

      <div class="head">
        <p class="eyebrow">Transcript &middot; Copy Slip</p>
        <h2>Chat Downloader</h2>
      </div>

      <div class="rule" aria-hidden="true"></div>

      <div class="options">

        <label class="check">
          <input type="checkbox" id="includeTimestamp" checked>
          <span>Include timestamp in filename</span>
        </label>

        <label class="check">
          <input type="checkbox" id="includeMetadata" checked>
          <span>Include metadata header</span>
        </label>

        <label class="check">
          <input type="checkbox" id="includeThinking" checked>
          <span>Include thinking process</span>
        </label>

        <div class="field">
          <label for="filenamePrefix">Filename prefix</label>
          <input
            type="text"
            id="filenamePrefix"
            placeholder="Model chat"
            value="Model chat"
            spellcheck="false"
            autocomplete="off"
          >
        </div>

      </div>

      <div class="rule" aria-hidden="true"></div>

      <div class="actions">
        <button id="downloadBtn" class="action action-a">
          <span class="tab" aria-hidden="true">Copy 1</span>
          <span class="label">Download <b>.md</b></span>
        </button>
        <button id="downloadDocxBtn" class="action action-b">
          <span class="tab" aria-hidden="true">Copy 2</span>
          <span class="label">Download <b>.doc</b></span>
        </button>
        <button id="copyBtn" class="action action-c">
          <span class="tab" aria-hidden="true">Copy 3</span>
          <span class="label">Copy to clipboard</span>
        </button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
