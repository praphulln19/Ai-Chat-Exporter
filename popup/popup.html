<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>💬 Chat Downloader</h2>
    <div class="options">
      <label>
        <input type="checkbox" id="includeTimestamp" checked>
        Include timestamp in filename
      </label>
      <label>
        <input type="checkbox" id="includeMetadata" checked>
        Include metadata header
      </label>
      <label>
        <input type="checkbox" id="includeThinking" checked>
        Include thinking process
      </label>
      <label>
        Filename prefix:
        <input type="text" id="filenamePrefix" value="outlier-chat">
      </label>
    </div>
    <button id="downloadBtn">📥 Download .md</button>
    <button id="downloadDocxBtn">📄 Download .docx</button>
    <button id="copyBtn">📋 Copy to Clipboard</button>
    <p id="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
